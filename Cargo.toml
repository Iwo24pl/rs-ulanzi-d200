[package]
name = "rs-ulanzi-d200"
version = "0.2.0"
edition = "2024"

[dependencies]
async-hid = { version = "0.5.1", default-features = false, features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.33"
serde_json = "1.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11.10"
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.2", features = ["full"] }
futures-util = "0.3.31"
async-trait = "0.1"
chrono = "0.4.44"
sysinfo = "0.39.2"
image = { version = "0.25.9", features = ["jpeg"] }
data-url = "0.3"
openaction = "2.6.0"
nvml-wrapper = { version = "0.12.1", optional = true }

[dependencies.uuid]
version = "1.23.4"
# Lets you generate random UUIDs
features = [
    "v7",
]

[features]
default = ["nvidia"]
nvidia = ["dep:nvml-wrapper"]

[target.'cfg(windows)'.dependencies]
async-hid = { version = "0.5.1", default-features = false, features = ["tokio", "win32"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
